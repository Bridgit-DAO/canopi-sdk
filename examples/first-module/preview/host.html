<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablication preview</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.4 system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px; }
  .sidebar { border: 1px solid #8884; border-radius: 8px; height: 640px; display: flex; flex-direction: column; overflow: hidden; }
  .ribbon { padding: 6px 10px; border-bottom: 1px solid #8884; display: flex; gap: 8px; align-items: center; }
  .ribbon .badge { background: #d33; color: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; }
  .label { font-size: 11px; opacity: .7; padding: 4px 10px; }
  #slot { flex: 1; }
  #slot iframe { width: 100%; height: 100%; border: 0; display: block; }
  .panel { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  fieldset { border: 1px solid #8884; border-radius: 8px; }
  input { width: 100%; box-sizing: border-box; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="ribbon"><span id="tab"></span><span id="badge" class="badge" hidden></span></div>
  <div class="label" id="appby"></div>
  <div id="slot"></div>
</div>
<div class="panel">
  <fieldset>
    <legend>Page context (what page.getContext answers)</legend>
    <input id="url" value="https://example.com/articles/hello" aria-label="Page URL">
    <input id="title" value="Hello, example" aria-label="Page title">
    <button id="navigate" type="button">Navigate (fires page.onContextChange)</button>
    <button id="nopage" type="button">No page (null)</button>
  </fieldset>
  <fieldset>
    <legend>Host</legend>
    <button id="theme" type="button">Toggle theme</button>
    <button id="reload" type="button">Reload app</button>
    <button id="clear" type="button">Clear module storage</button>
  </fieldset>
  <fieldset><legend>Module storage (held by the host)</legend><pre id="storage"></pre></fieldset>
  <fieldset><legend>Bridge calls</legend><pre id="log"></pre></fieldset>
</div>
<script type="module" src="/host.js"></script>
</body>
</html>
